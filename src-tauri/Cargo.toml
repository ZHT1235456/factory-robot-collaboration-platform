[package]
name = "robot-collaboration"
version = "1.0.0"
edition = "2021"
description = "基于 SuperMimic 的工业机器人协同作业仿真"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
